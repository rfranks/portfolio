t-centric clinician workflows: assignee/queue switching, drag-and-drop reassignment UX, state-driven filtering and pagination, and synchronized visit-list rendering across assignment contexts.\",\"demoGifUrl\":\"/personal/demogifs/assignment_list_demo.gif\",\"watermark\":{\"kind\":\"image\",\"src\":\"/personal/images/employers/patientkeeper.png\",\"alt\":\"PatientKeeper watermark\",\"width\":280,\"height\":140,\"containerClassName\":\"pointer-events-none absolute bottom-5 right-5 opacity-[0.12] transition-all duration-500 group-hover:translate-y-[-2px] group-hover:opacity-[0.2]\",\"imageClassName\":\"h-auto w-56 object-contain\"},\"technologiesUsed\":[{\"name\":\"Backbone.js\",\"url\":\"https://backbonejs.org/\",\"emoji\":\"🦴\"},{\"name\":\"Handlebars.js\",\"url\":\"https://handlebarsjs.com/\",\"emoji\":\"🤲\"},{\"name\":\"pk-common-ui (shared UI utilities)\",\"url\":\"https://example.org/pk-common-ui\",\"emoji\":\"🧰\"},{\"name\":\"Spring Web MVC\",\"url\":\"https://spring.io/projects/spring-framework\",\"emoji\":\"🌱\"},{\"name\":\"Spring Boot\",\"url\":\"https://spring.io/projects/spring-boot\",\"emoji\":\"👢\"},{\"name\":\"Java / Maven (multi-module)\",\"url\":\"https://maven.apache.org/\",\"emoji\":\"☕\"},{\"name\":\"JUnit / Mockito\",\"url\":\"https://junit.org/\",\"emoji\":\"🧪\"},{\"name\":\"MapStruct (optional mappers)\",\"url\":\"https://mapstruct.org/\",\"emoji\":\"🗺️\"},{\"name\":\"Mermaid (diagrams)\",\"url\":\"https://mermaid.js.org/\",\"emoji\":\"🧜‍♀️\"}],\"specifications\":{\"facadeArchitecture\":{\"goal\":\"Stabilize contracts for UI while the domain/DAO layer evolves.\",\"modules\":[\"patient-list-war: Backbone/Handlebars UI (AssignmentListView, VisitListView, routers, templates).\",\"patient-list-rest: Spring MVC controllers exposing versioned REST endpoints that accept/return patient-list-api DTOs only.\",\"patient-list-api: Facade interfaces + DTOs (AssignmentListDto, VisitDto, PagingDto, FilterDto).\",\"patient-list-services: Facade implementations,  listId.\"},\"router\":{\"AssignmentRouter\":\"Routes '#/assignments/:id?assignee=RN1\u0026page=1\u0026sort=admitTime,desc\u0026filters=...' to instantiate AssignmentListView with AssignmentState and VisitCollection seeded from query.\"},\"renderingPipeline\":\"AssignmentRouter → AssignmentListView.initialize() → active VisitCollection.fetch({data: state.toQuery()}) → REST returns VisitDto[] + paging → collection.reset(items) → VisitListView.render() (row subviews) → Handlebars templates produce the table inside the AssignmentListView region.\"},\"management\":{\"assets\":\"patient-list-war bundles Backbone modules and Handlebars templates; cache-busted filenames. pk-common-ui provides shared widgets.\",\"performance\":\"Server-side pagination/sort/filter, tuned DAO queries to avoid N+1, ETag/If-None-Match, gzip/brotli, client-side debounce on filter/search.\",\"reliability\":\"Controller timeouts, service retries for transient DB faults, idempotent prompt job endpoints.\",\"telemetry\":\"UI emits audit events (assignee switch, filter change, export) to /audit; services log timing and cache hit/miss.\"}},\"diagrams\":[{\"title\":\"Component Diagram\",\"shortText\":\"Component responsibilities and integration touchpoints.\",\"description\":\"Breaks down AssignmentList and VisitList composition, shared toolbar/pagination wiring, and corresponding backend controller/repository responsibilities.\",\"selectorOptionVisual\":{\"type\":\"emoji\",\"icon\":\"🧩\"},\"type\":\"flowchart\",\"diagram\":\"$1a\",\"autoFit\":{\"padding\":14,\"scaleMultiplier\":1,\"verticalAlign\":\"top\",\"offsetX\":0,\"offsetY\":0}},{\"title\":\"Sequence Diagram\",\"shortText\":\"End-to-end interaction flow for key operations.\",\"description\":\"Captures assignment-list runtime flow from route initialization and visit fetches through state updates and incremental UI refresh.\",\"selectorOptionVisual\":{\"type\":\"emoji\",\"icon\":\"🔀\"},\"type\":\"sequenceDiagram\",\"diagram\":\"$1b\",\"autoFit\":{ t_f.push([1,"Patient Assignment List is a clinician operations workflow built for high-change environments where ownership, queue visibility, and handoff clarity must stay accurate in real time. Instead of static roster views, it gives teams a manageable assignment surface with drag-and-drop interaction, role-aware filtering, and time-based population criteria designed for shift-driven care. The frontend is implemented with Backbone.js and Handlebars, using AssignmentList and nested VisitList composition so users can move between assignment-level and patient-level context without losing state. Shared pk-common-ui controls keep filtering, paging, and bulk actions consistent while the interaction model remains fast under heavy use. On the backend, Spring MVC and Spring Boot expose versioned REST contracts over facade-driven service boundaries. That separation allows assignment and visit DTO contracts to remain stable while business rules, mappers, and DAO queries evolve behind the facade layer, reducing UI churn and making incremental backend changes safer. The implementation emphasizes reliability and predictability: debounced query flows, server-side pagination and filter semantics, authorization checks scoped to assignment context, and observability telemetry around assignee changes, filter behavior, and query latency. The result is a workflow that helps clinical teams rebalance patient ownership quickly while preserving trust in system state."])</script><script>self.__next_f.push([1,"12:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"Patient Assignment List Project Project\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"$1c\"}],[\"$\",\"link\",\"2\",{\"rel\":\"manifest\",\"href\":\"/portfolio/manifest.json\",\"crossOrigin\":\"$undefined\"}],[\"$\",\"link\",\"3\",{\"rel\":\"shortcut icon\",\"href\":\"/portfolio/favicon.ico\"}],[\"$\",\"link\",\"4\",{\"rel\":\"icon\",\"href\":\"/portfolio/favicon.ico\"}],[\"$\",\"link\",\"5\",{\"rel\":\"apple

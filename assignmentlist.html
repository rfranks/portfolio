kflow design.\",\"watermark\":{\"kind\":\"image\",\"containerClassName\":\"pointer-events-none absolute bottom-5 right-5 opacity-[0.12] transition-all duration-500 group-hover:translate-y-[-2px] group-hover:opacity-[0.2]\",\"src\":\"/personal/images/employers/patientkeeper.png\",\"alt\":\"PatientKeeper watermark\",\"width\":280,\"height\":140,\"imageClassName\":\"h-auto w-56 object-contain\"},\"demoGifUrl\":\"/demogifs/assignment_list_demo.gif\",\"specifications\":{\"facadeArchitecture\":{\"goal\":\"Stabilize contracts for UI while the domain/DAO layer evolves.\",\"modules\":[\"patient-list-war: Backbone/Handlebars UI (AssignmentListView, VisitListView, routers, templates).\",\"patient-list-rest: Spring MVC controllers exposing versioned REST endpoints that accept/return patient-list-api DTOs only.\",\"patient-list-api: Facade interfaces + DTOs (AssignmentListDto, VisitDto, PagingDto, FilterDto).\",\"patient-list-services: Facade implementations, mapping between DTOs and domain entities, validation, transactions, caching.\",\"patient-list-dao: Repositories/queries; isolates persistence (SQL/ORM).\"],\"flow\":\"UI (war) → REST (rest) ↔ DTO (api) → Facade (services) → Repository (dao) → DB.\",\"evolution\":\"Additive DTOs with /api/v1/* routes, deprecation windows, and mappers contained in services so UI is insulated.\",\"security\":\"AuthN/Z enforced in patient-list-rest and re-checked inside Facade using user/org scope for list/assignment access.\"},\"backboneAssignmentListFlow\":{\"intent\":\"Render an Assignment List that nests/embeds a VisitList inside the AssignmentListView (e.g., by assignee/role/queue).\",\"uiModelsAndCollections\":{\"AssignmentModel\":\"Client model mirroring AssignmentListDto (id, name, criteria, owner, counts).\",\"AssignmentCollection\":{\"url\":\"/api/v1/assignmentLists\",\"parse\":\"Returns array of AssignmentModel and paging.\"},\"VisitModel\":\"Client model mirroring VisitDto for row rendering.\",\"VisitCollection\":{\"url\":\"/api/v1/

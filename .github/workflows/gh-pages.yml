name: Deploy Next.js to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod
          lfs: true # Fetch large files

      - name: 🧹 Turn off LFS
        run: >-
          git lfs uninstall;
          rm -Rf .git;
          rm .gitattributes;

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: ✅ Local quality gate parity (same as pre-push / pre-pr)
        run: npm run prepr

      - name: 🏗️ Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: "/portfolio"

      - name: 📊 Bundle budget checks
        run: npm run check:bundle-budget

      - name: 🐹 Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.18.0"

      - name: 🃏 Build blackjack wasm
        run: |
          cd ./go/blackjack
          GOOS=js GOARCH=wasm go build -o ../../out/apps/blackjack/wasm/main.wasm
          cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" ../../out/apps/blackjack/js/

      - name: 🚀 Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages

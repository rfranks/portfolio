tAudits?answerId=… until a record exists; then copies score, scoreReasoning, valid, invalidReason.\",\"retryLogic\":\"If !valid OR score \u003c 7 (MINIMUM_SCORE_THRESHOLD) and retryCount \u003c 3 (MAX_RETRY_ON_LOW_SCORE), PatientPrompt re-calls chatUri for that prompt; otherwise continues. Defaults when scoring disabled: score=10 and valid=true.\"},\"UX Behavior\":{\"chips\":\"When multiple prompts, PromptChips render; visibility changes once content+citations exist and prompt is completed.\",\"modal\":\"AISummaryModal provides free-text ask, recent questions (localStorage), suggested combo prompts, model picker, categories multiselect, and guardrails toggle.\",\"postMessage\":\"Parent ↔ IFrame integration: startLoading/stopLoading with { module }, fetchAnswer events carrying { promptEnum | question, data, model, patientId }.\",\"scroll\":\"Back-to-top FAB via useScrollTrigger on the prompts container.\",\"errorBanners\":\"HTTP 401/403/404/500 specific messages; 413/context-length guidance; generic catch-all lists troubleshooting steps.\"},\"Persistence (localStorage keys)\":[\"page.patientPromptEnum.initialPromptEnum\",\"page.patientPromptEnum.userFreeTextQuestions\",\"page.patientPromptEnum.model\",\"page.patientPromptEnum.isUsingGuardrails\",\"page.patientPromptEnum.categories\"],\"Performance / Resilience\":[\"Dynamic import of heavy client widgets; SSR disabled.\",\"Single DataProvider instance; axios interceptor injects bearer.\",\"Minimal prompt lookups via usePromptResources and useSubPrompts.\",\"Polling chatAudits with 5s delay until record is present.\",\"Merges response.context to persist dynamic placeholder values across retries.\"],\"Primary Types (ui/interfaces \u0026 aichat/models)\":{\"UI.ChatAnswer\":\"{ answerId?, prompt?, content?, categories?, citationsMap?, score?, scoreReasoning? }\",\"UI.PatientRecord\":\"Minimal EHR snapshot interface used by UI.\",\"UI.Prompt\":\"{ id, promptEnum, text, fullText, title?, categories? }\",\"API.ChatRequest\": cript><script>self.__next_f.push([1,"AI Clinical Copilot is a physician-facing workflow built for real clinical pace. Instead of forcing providers to manually sift through fragmented chart history, it assembles patient context into concise, citation-backed answers that can be validated quickly at the point of care.\n\nThe frontend is delivered in Next.js/React with a strong emphasis on interaction speed, progressive disclosure, and context retention across follow-up questions. Behind that UI, Python and Azure Functions coordinate retrieval, prompt orchestration, and answer generation over structured and unstructured EHR artifacts.\n\nThe core pattern is retrieval-augmented generation (RAG) with explicit grounding: prompts are enriched with relevant chart evidence, response parts are returned with citations, and audit-oriented scoring/guardrail pathways can trigger retries when quality is below threshold. This keeps output useful in practice, not just plausible in a demo.\n\nFrom a systems perspective, the project combines low-latency UX, typed API contracts, and operational resilience in one loop. The result is a copilot that helps physicians spend less time scrolling and more time deciding, while maintaining the transparency needed for clinical trust."])</script><script>self.__next_f.push([1,"10:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"AI-Driven Clinical Copilot Project\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"$1d\"}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_f.push([1,"15:\"$10:metadata\"\n"])</script></body></html>

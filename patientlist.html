ages/employers/patientkeeper.png\",\"alt\":\"PatientKeeper watermark\",\"width\":280,\"height\":140,\"imageClassName\":\"h-auto w-56 object-contain\"},\"demoGifUrl\":\"/demogifs/patient_list_demo.gif\",\"specifications\":{\"facadeArchitecture\":{\"purpose\":\"Stabilize UI contracts while allowing domain and DAO evolution.\",\"modules\":[\"patient-list-war: Backbone/Handlebars UI, routers, views, templates, static assets.\",\"patient-list-rest: Spring Web controllers that only accept/return patient-list-api DTOs.\",\"patient-list-api: Facade interfaces and DTOs (VisitDto, VisitListDto, PagingDto, FilterDto).\",\"patient-list-services: Implements the Facade; mapping between DTOs and domain; validation; transactions; caching.\",\"patient-list-dao: Persistence repositories/queries; no API types leak upward.\"],\"callFlow\":\"UI (war) → REST controller (rest) ↔ DTOs (api) → Facade service (services) → Repository (dao) → DB.\",\"mapping\":\"DTO↔Domain mapping occurs only inside patient-list-services via MapStruct or manual mappers.\",\"evolution\":\"Additive DTO changes with versioned REST routes (/api/v1/*), deprecations flagged in Facade; UI remains stable.\"},\"backboneVisitListFlow\":{\"uiModelsAndCollections\":{\"VisitModel\":\"Client-side model mirroring VisitDto fields used by the UI (id, mrn, name, admitTime, location, provider, status, flags).\",\"VisitCollection\":{\"url\":\"/api/v1/visits\",\"parse\":\"Extracts array and paging metadata from {items:[], paging:{...}}.\",\"behavior\":\"Supports query params for listId, search, filters, sort, page, pageSize.\"},\"VisitListState\":\"Backbone.Model that stores route-bound state (listId, page, sort, filters); converts to query string with toQuery().\"},\"views\":{\"VisitListView\":\"Owns lifecycle and layout; listens to VisitCollection events 'request','sync','reset','error' to toggle spinner, render rows, show empty/error.\",\"VisitItemView\":\"Renders a single visit row; rerenders on model change.\",\"ToolbarView\":\"Search box, filter chips, bulk actions; emits 'filter:changed', 'search:typed', 'action:export'.\",\"PaginationView\":\"Changes page → updates VisitListState → triggers fetch.\",\"WizardView\":\"Multi-step builder/manager for patient lists; saves via /api/v1/visitLists and then routes to VisitList with the new listId.\"},\"router\":{\"VisitRouter\":\"Routes '#/visits?listId=123\u0026page=1\u0026sort=admitTime,desc\u0026filters=...' to instantiate VisitListView with a VisitCollection and VisitListState seeded from the query.\"},\"renderingPipeline\":\"VisitRouter → VisitListView.initialize() → collection.fetch({data: state.toQuery()}) → REST returns VisitDto[] + paging → collection.reset(items) → VisitListView.render() → for each model new VisitItemView({model}).render() → Handlebars templates produce the table.\"},\"managementOfPatientListApp\":{\"assets\":\"patient-list-war bundles Backbone modules, templates (.hbs), and pk-common-ui widgets; versioned static paths to enable long-lived caching with cache-busting.\",\"security\":\"Spring Security in patient-list-rest validates JWT/session; per-list authorization enforced in Facade based on user/org/role.\",\"reliability\":\"Controller timeouts, service-level retries for transient DB faults, idempotent job endpoints for PromptJob.\",\"performance\":\"Server-side pagination/sort/filter, DAO query tuning (indexes, joins to avoid N+1), HTTP caching with ETag/If-None-Match, compressed assets.\",\"telemetry\":\"UI emits audit events (route, filter change, export) to /audit; services log query timings; PromptJob publishes progress to a job-status endpoint.\"}},\"technologiesUsed\":[{\"name\":\"Backbone.js\",\"url\":\"https://backbonejs.org/\"},{\"name\":\"Handlebars.js\",\"url\":\"https://handlebarsjs.com/\"},{\"name\":\"pk-common-ui (shared widgets/utilities)\",\"url\":\"https://example.org/pk-common-ui\"},{\"name\":\"Spring Web MVC\",\"url\":\"https://spring.io/projects/spring-framework\"},{\"name\":\"Spring Boot\",\"

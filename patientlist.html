tence repositories/queries; no API types leak upward.\"],\"callFlow\":\"UI (war) → REST controller (rest) ↔ DTOs (api) → Facade service (services) → Repository (dao) → DB.\",\"mapping\":\"DTO↔Domain mapping occurs only inside patient-list-services via MapStruct or manual mappers.\",\"evolution\":\"Additive DTO changes with versioned REST routes (/api/v1/*), deprecations flagged in Facade; UI remains stable.\"},\"backboneVisitListFlow\":{\"uiModelsAndCollections\":{\"VisitModel\":\"Client-side model mirroring VisitDto fields used by the UI (id, mrn, name, admitTime, location, provider, status, flags).\",\"VisitCollection\":{\"url\":\"/api/v1/visits\",\"parse\":\"Extracts array and paging metadata from {items:[], paging:{...}}.\",\"behavior\":\"Supports query params for listId, search, filters, sort, page, pageSize.\"},\"VisitListState\":\"Backbone.Model that stores route-bound state (listId, page, sort, filters); converts to query string with toQuery().\"},\"views\":{\"VisitListView\":\"Owns lifecycle and layout; listens to VisitCollection events 'request','sync','reset','error' to toggle spinner, render rows, show empty/error.\",\"VisitItemView\":\"Renders a single visit row; rerenders on model change.\",\"ToolbarView\":\"Search box, filter chips, bulk actions; emits 'filter:changed', 'search:typed', 'action:export'.\",\"PaginationView\":\"Changes page → updates VisitListState → triggers fetch.\",\"WizardView\":\"Multi-step builder/manager for patient lists; saves via /api/v1/visitLists and then routes to VisitList with the new listId.\"},\"router\":{\"VisitRouter\":\"Routes '#/visits?listId=123\u0026page=1\u0026sort=admitTime,desc\u0026filters=...' to instantiate VisitListView with a VisitCollection and VisitListState seeded from the query.\"},\"renderingPipeline\":\"VisitRouter → VisitListView.initialize() → collection.fetch({data: state.toQuery()}) → REST returns VisitDto[] + paging → collection.reset(items) → VisitListView.render() → for each model new VisitItemView({model}).render() → Handlebars templates produce the table.\"},\"managementOfPatientListApp\":{\"assets\":\"patient-list-war bundles Backbone modules, templates (.hbs), and pk-common-ui widgets; versioned static paths to enable long-lived caching with cache-busting.\",\"security\":\"Spring Security in patient-list-rest validates JWT/session; per-list authorization enforced in Facade based on user/org/role.\",\"reliability\":\"Controller timeouts, service-level retries for transient DB faults, idempotent job endpoints for PromptJob.\",\"performance\":\"Server-side pagination/sort/filter, DAO query tuning (indexes, joins to avoid N+1), HTTP caching with ETag/If-None-Match, compressed assets.\",\"telemetry\":\"UI emits audit events (route, filter change, export) to /audit; services log query timings; PromptJob publishes progress to a job-status endpoint.\"}},\"blockDiagram\":\"graph TD;\\n  WAR[patient-list-war\\\\\\nBackbone/Handlebars UI] --\u003e REST[patient-list-rest\\\\\\nSpring Controllers];\\n  REST --\u003e API[patient-list-api\\\\\\nFacade + DTOs];\\n  API \u003c--implements--\u003e SRV[patient-list-services\\\\\\nBusiness Logic, Mapping, Validation];\\n  SRV --\u003e DAO[patient-list-dao\\\\\\nRepositories/Queries];\\n  DAO --\u003e DB[(Database)];\\n  WAR -. static assets .-\u003e ASSETS[Templates JS CSS];\",\"componentDiagram\":\"$9\",\"sequenceDiagram\":\"$a\",\"diagrams\":[{\"title\":\"Component Diagram\",\"shortText\":\"Component responsibilities and integration touchpoints.\",\"description\":\"Details Backbone router/view/state relationships and their mapping to Spring controllers, facades, repositories, and DTO boundaries.\",\"selectorOptionVisual\":{\"type\":\"emoji\",\"icon\":\"🧩\"},\"type\":\"flowchart\",\"diagram\":\"$b\"},{\"title\":\"Sequence Diagram\",\"shortText\":\"End-to-end interaction flow for key operations.\",\"description\":\"Traces the visit-list request lifecycle from route navigation through server query execution and client-sid

<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TalentForge logo</title>
  <desc id="desc">Hexagonal emblem with a forged spark and TF monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222" />
      <stop offset="100%" stop-color="#182f57" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5de4c7" />
      <stop offset="100%" stop-color="#67a6ff" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <path
    d="M256 52 L415 144 L415 328 L256 420 L97 328 L97 144 Z"
    fill="none"
    stroke="#3a5f99"
    stroke-width="18"
    opacity="0.95"
  />

  <path
    d="M255 132 L312 247 L271 247 L322 367 L217 242 L258 242 Z"
    fill="url(#accent)"
    filter="url(#softGlow)"
  />

  <path
    d="M160 350 L160 184 L278 184"
    fill="none"
    stroke="#eef8ff"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M284 184 L364 184 M324 184 L324 350"
    fill="none"
    stroke="#eef8ff"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
